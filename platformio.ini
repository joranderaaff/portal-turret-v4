; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;

[platformio]
default_envs = lolin_s3_mini

[common]
lib_deps =
	https://github.com/adafruit/Adafruit_Sensor
	madhephaestus/ESP32Servo@^1.2.1
	adafruit/Adafruit ADXL345
	fastled/FastLED
	bxparks/AceRoutine@1.5.1
	ESP32Async/ESPAsyncWebServer
	https://github.com/pschatzmann/arduino-libhelix
	https://github.com/pschatzmann/arduino-audio-tools
	
[env:lolin_s3_mini]
platform = espressif32
board = lolin_s3_mini
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
framework = arduino
build_flags =
  -Isrc
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -DUSE_IDF_LOGGER
lib_deps =
	${common.lib_deps}

; Same build, but uploaded over WiFi to the turret's own access point.
; Connect to the "Portal Turret" network first, then: pio run -e lolin_s3_mini_ota -t upload
[env:lolin_s3_mini_ota]
extends = env:lolin_s3_mini
upload_protocol = custom
upload_command = curl --fail --max-time 120 -F "firmware=@$SOURCE" http://192.168.4.1/update