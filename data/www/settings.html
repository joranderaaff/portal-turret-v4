<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header id="site-nav"><span class="brand">Portal Turret</span></header>
  <main>
    <h1>Settings</h1>
    <form id="settings-form" novalidate>
      <div id="fields">Loading…</div>
      <div class="actions">
        <button type="submit">Save</button>
        <span id="status" role="status"></span>
      </div>
    </form>
    <div class="actions">
      <button type="button" id="reset-settings">Reset settings to defaults</button>
      <button type="button" id="enable-multitarget">Enable Multitarget</button>
    </div>
  </main>
  <script src="nav.js"></script>
  <script src="settings.js"></script>
</body>

</html>
