<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&display=swap"
    rel="stylesheet">
    
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header id="site-nav"><span class="brand"><img src="apreture_logo.png" alt="Portal Turret"></span></header>
  <main>
    <h1>Settings</h1>
    <form id="settings-form" novalidate>
      <div id="fields">Loading…</div>
      <div class="actions">
        <button type="submit">Save</button>
        <span id="status" role="status"></span>
      </div>
    </form>
    <div class="actions">
      <button type="button" id="reset-settings">Reset settings to defaults</button>
      <button type="button" id="enable-multitarget">Enable Multitarget</button>
    </div>
  </main>
  <div id="interlaced"></div>

  <script src="nav.js"></script>
  <script src="settings.js"></script>
</body>

</html>
